comparison_variants:
- name: minimal8_calibrated_logistic_regression
  model_family: logistic
  features:
  - mother_age
  - mother_bmi
  - prepregnancy_hypertension
  - prepregnancy_diabetes
  - prior_adverse_pregnancy_history
  - prior_live_births
  - smoking_before_or_during_pregnancy
  - multiple_gestation_known_or_suspected
- name: minimal8_calibrated_lightgbm
  model_family: lightgbm
  features:
  - mother_age
  - mother_bmi
  - prepregnancy_hypertension
  - prepregnancy_diabetes
  - prior_adverse_pregnancy_history
  - prior_live_births
  - smoking_before_or_during_pregnancy
  - multiple_gestation_known_or_suspected
- name: minimal7_no_multiple_calibrated_logistic_regression
  model_family: logistic
  features:
  - mother_age
  - mother_bmi
  - prepregnancy_hypertension
  - prepregnancy_diabetes
  - prior_adverse_pregnancy_history
  - prior_live_births
  - smoking_before_or_during_pregnancy
lightgbm:
  objective: binary
  n_estimators: 500
  learning_rate: 0.03
  num_leaves: 15
  max_depth: 3
  min_child_samples: 100
  subsample: 0.8
  colsample_bytree: 0.8
  class_weight: balanced
  random_state: 42
  verbosity: -1
model_version: '2026-05-16'
